<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">sci-manuscript lifecycle</title>
  <desc id="desc">Flow from an existing research project through environment checking, initialization, build, revision, explicit edits and responses, submission artifacts, and safe rollback.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#212838"/>
      <stop offset="1" stop-color="#1a1f2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a879e8"/>
      <stop offset="0.38" stop-color="#e55aa8"/>
      <stop offset="0.7" stop-color="#55c3e5"/>
      <stop offset="1" stop-color="#61c4aa"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#aab2c8"/>
    </marker>
    <style>
      .bg{fill:url(#panel);stroke:#3a4358;stroke-width:2}
      .box{fill:#293246;stroke:#55617a;stroke-width:2}
      .box-purple{fill:#2b2740;stroke:#a879e8;stroke-width:2.5}
      .box-cyan{fill:#20333d;stroke:#55c3e5;stroke-width:2.5}
      .box-teal{fill:#213633;stroke:#61c4aa;stroke-width:2.5}
      .box-amber{fill:#3a3022;stroke:#f2b85b;stroke-width:2.5}
      .txt{font:600 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8f8f2;text-anchor:middle}
      .sub{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#aab2c8;text-anchor:middle}
      .small{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dddbe2;text-anchor:middle}
      .line{fill:none;stroke:#aab2c8;stroke-width:3;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#aab2c8;stroke-width:2.5;stroke-dasharray:9 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="24" y="24" width="1152" height="672" rx="28" class="bg"/>
  <rect x="76" y="62" width="1048" height="5" rx="2.5" fill="url(#accent)"/>

  <rect x="70" y="130" width="180" height="92" rx="16" class="box"/>
  <text x="160" y="168" class="txt">Project</text>
  <text x="160" y="198" class="sub">existing research workspace</text>

  <rect x="305" y="130" width="160" height="92" rx="16" class="box-cyan"/>
  <text x="385" y="168" class="txt">doctor</text>
  <text x="385" y="198" class="sub">environment check</text>

  <rect x="520" y="130" width="190" height="92" rx="16" class="box-purple"/>
  <text x="615" y="166" class="txt">init</text>
  <text x="615" y="196" class="small">initial_submission / r00</text>

  <rect x="770" y="130" width="180" height="92" rx="16" class="box"/>
  <text x="860" y="168" class="txt">build</text>
  <text x="860" y="198" class="sub">clean manuscript</text>

  <path d="M250 176 H305" class="line"/>
  <path d="M465 176 H520" class="line"/>
  <path d="M710 176 H770" class="line"/>

  <rect x="760" y="318" width="200" height="96" rx="16" class="box-purple"/>
  <text x="860" y="354" class="txt">revision</text>
  <text x="860" y="384" class="small">revision_01 / r01</text>

  <rect x="465" y="318" width="230" height="96" rx="16" class="box"/>
  <text x="580" y="352" class="txt">Explicit edits</text>
  <text x="580" y="382" class="sub">manuscript + responses</text>

  <rect x="190" y="318" width="210" height="96" rx="16" class="box-teal"/>
  <text x="295" y="352" class="txt">submission</text>
  <text x="295" y="382" class="sub">build formal artifacts</text>

  <path d="M860 222 V318" class="line"/>
  <path d="M760 366 H695" class="line"/>
  <path d="M465 366 H400" class="line"/>

  <rect x="110" y="510" width="370" height="114" rx="18" class="box-cyan"/>
  <text x="295" y="548" class="txt">Revision artifacts</text>
  <text x="295" y="579" class="sub">clean · marked · response letter</text>
  <text x="295" y="606" class="sub">version-local submission package</text>

  <path d="M295 414 V510" class="line"/>

  <rect x="730" y="510" width="330" height="114" rx="18" class="box-amber"/>
  <text x="895" y="548" class="txt">Safe rollback</text>
  <text x="895" y="579" class="sub">only if newest revision digest</text>
  <text x="895" y="606" class="sub">remains unchanged</text>

  <path d="M860 414 V466 Q860 490 884 490 H895 V510" class="dash"/>

  <path d="M480 566 H610 Q640 566 640 536 V470 Q640 444 666 444 H815 Q840 444 840 414" class="dash"/>
  <text x="644" y="545" class="small">next review round → adjacent revision</text>

  <text x="600" y="666" class="sub">Scientific text changes require explicit user authorization; lifecycle operations do not imply content-edit permission.</text>
</svg>