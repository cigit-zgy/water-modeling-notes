figures:
- id: Figure 1
  scope: main
  core_argument: true
  source_location: Original PDF physical p3
  role: 方法体系与生成流程示意
  question: 如何把论文及代码转成可被智能体调用的方法？
  what_is_shown: 工具、资源、提示三类MCP内容与环境/提取/测试智能体流程。
  variables_axes_groups: 流程节点及箭头，无统计坐标；a为使用结构，b为构建过程。
  comparison: 论文/代码的静态提供与经验证的工具服务形成概念对照，非对照实验。
  main_observation: 环境配置、工具提取、迭代测试与服务组装被分解为不同职责。
  authors_interpretation: 降低论文方法复用门槛并提高可复现性。
  evidence_strength: 体系说明充分；效果须由后续基准支持。
  limitations: 示意流程不证明任意仓库都能转换；测试参照原代码时可能继承源方法错误。
  supported_claim:
  - C01
  blog_role: used
  publication:
    mode: discussion_only
    reason: CC BY-NC-ND 4.0; task excludes original images and near replicas. Original objects discussed in words
      only.
  panels:
  - id: a
    role: 工具、静态资源、流程提示连接对话智能体
    relationship: 解释最终接口组成
  - id: b
    role: 环境与方法提取后进入测试修正并部署
    relationship: 解释a中服务如何生成
- id: Figure 2
  scope: main
  core_argument: true
  source_location: Original PDF physical p4
  role: 准确率、查询效率与开放推理示例
  question: 固定工具是否改善执行，是否也足以支持因果解释？
  what_is_shown: a工具接口；b教程/新问题准确率；c时长箱线图；d规划-行动-观察及SORT1解释。
  variables_axes_groups: b纵轴通过比例百分数，方法三组；c纵轴秒，15查询×5次=75运行/方法/任务类；d基因表达及调控预测。
  comparison: Paper2Agent、Claude加仓库、Biomni；教程与新查询并列。
  main_observation: 教程98.7%与新查询100%的均值高于比较方法；c查询用时较短。d将SORT1列为候选。
  authors_interpretation: 预构建MCP提高可靠性和效率，并支持重新评估原研究解释。
  evidence_strength: 有限预定义任务的执行证据较强；d为机制推理案例。
  limitations: b误差条为5次运行的标准误；75次不是75个不同问题。开放题82.7%在正文，不在b两组柱状图。SORT1并未由本图确定因果；其他候选同有强eQTL证据。
  supported_claim:
