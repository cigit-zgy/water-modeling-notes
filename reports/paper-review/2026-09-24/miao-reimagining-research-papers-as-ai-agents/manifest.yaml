claims:
- id: C01
  author_claim: 论文及代码可变成工具、资源和流程提示的MCP服务。
  source_section: Overview / Methods
  source_page: 2
  figure:
  - Figure 1
  evidence_text: MCP tools are executable functions that encapsulate a paper’s methodological contributions.
  interpretation: 接口封装与验证环节使方法进入可执行工作流。
  critical_assessment: 不是从PDF自动恢复一切科学方法；依赖代码、数据和环境。
- id: C02
  author_claim: AlphaGenome封装在受测查询上提高正确率和效率。
  source_section: AlphaGenome agent for genomics
  source_page: 3
  figure:
  - Figure 2
  evidence_text: 98.7 ± 1.3% accuracy on 15 tutorialderived queries and 100.0 ± 0.0% accuracy on 15 novel queries
  interpretation: 预定义工具减少每次临时生成代码的不确定性。
  critical_assessment: 所引误差为标准误，有限查询族性能不等于一般推理或因果发现正确率。
- id: C03
  author_claim: Scanpy智能体复现匹配参数下的人工流程输出。
  source_section: Figure 3 / Scanpy agent for single-cell analysis
  source_page: 6
  figure:
  - Figure 3
  evidence_text: 原PDF观察：Figure 3c左列为Scanpy agent results，右列为Human researcher results；该标签不属于a面板。左右按高变基因、UMAP和细胞类型标记基因点图成对排列，b面板说明按顺序调用工具的提示流程。
  interpretation: 图c的正确左右对应支持复现解释，a/b解释接口与顺序。
  critical_assessment: 这是PDF可视观察的转述而非作者原句；不由截图推导额外统计指标。
  evidence_adjudication: A02
- id: C04
  author_claim: 跨论文整合支持激活状态下GPR137候选优先级。
  source_section: Paper agents collaborate for discovery
  source_page: 7
  figure:
  - Figure 4
  evidence_text: Spearman correlation = 0.630, P = 4.71 × 10<sup>−3</sup> at Stim48hr
  interpretation: 已有扰动数据与计算排序相互支持。
  critical_assessment: 支持候选优先级而非终局因果确认；人工从十项策略中选择分析路径。
- id: C05
  author_claim: TISSUE服务支持示例复现与数据访问。
  source_section: Extended Data Figure 1
  source_page: 14
  figure:
  - Extended Data Figure 1
  evidence_text: 原PDF观察：图注从左栏标题读起；C面板的Reproducibility须接右栏confirmed by matching human researcher results。D面板说明结构化资源支持标准化数据访问和自动下载。C面板左右分别是TISSUE
    agent和Human researchers的Acta2预测区间宽度空间图，颜色对应区间宽度。
  interpretation: 图注的C/D内容按源PDF分开解释。
  critical_assessment: 可视对照不支持新数据上的校准保证；未见补充说明。
  evidence_adjudication: A01
- id: C06
  author_claim: ADHD组合分析产生待验证机制假说。
  source_section: Extended Data Figure 2
  source_page: 15
  figure:
  - Extended Data Figure 2
  evidence_text: generating a candidate mechanistic hypothesis for ADHD risk that remains to be validated experimentally.
  interpretation: 作者明确将计算结果定位为候选机制。
  critical_assessment: 未获取补充表，不评价全部位点的召回率或新颖性。
- id: C07
  author_claim: 报告表声明部分统计项目已报告。
  source_section: Reporting Summary / Statistics
  source_page: 16
  figure:
  - Reporting Table 1
  evidence_text: 原PDF观察：Statistics十项从上到下，Confirmed为第1、3、6、7项；n/a为第2、4、5、8、9、10项。Confirmed分别对应样本量、统计检验、统计参数、零假设检验统计量和P值等的报告要求；这是作者的报告声明。
  interpretation: 源PDF恢复复选含义。
  critical_assessment: 不得把Confirmed视为独立审计；此excerpt是review者观察转述。
  evidence_adjudication: A03
- id: C08
  author_claim: 专家评分未对系统身份正式盲法。
  source_section: Reporting Summary / Blinding
  source_page: 18
  figure:
  - Reporting Table 2
  evidence_text: formal blinding to system identity was not feasible because the response formats and execution
    traces could reveal the evaluated system.
  interpretation: 独立评分与盲法是两个不同维度。
  critical_assessment: 这构成潜在评分偏差边界，但不能据此量化或断言偏差。
- id: C09
  author_claim: 规模测试中74/100篇计算生物学论文成功生成服务。
  source_section: Large-scale evaluation
  source_page: 5
  figure: []
  evidence_text: Among the 100 computational biology papers, 74 were successfully agentified, yielding 599 proposed
    tools, of which 593 passed automated validation.
  interpretation: 成功率表明可行性也显示代码/数据/环境边界。
  critical_assessment: 74篇成功子集上的问答正确率不能当成所有100篇的端到端成功率；补充细节未提供。
- id: C10
  author_claim: 工具验证使用数值/图像容差与失败淘汰。
  source_section: Methods / test verifier–improver
  source_page: 10
  figure: []
  evidence_text: with a 3% tolerance for floating-point values
